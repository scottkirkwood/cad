<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1275" width="1650" height="1275" style="background:#ffffff; font-family:'Liberation Sans', Arial, sans-serif;">
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5a36"/>
      <stop offset="50%" stop-color="#6e4324"/>
      <stop offset="100%" stop-color="#543217"/>
    </linearGradient>
    <linearGradient id="spfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="birchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  
  <!-- Background Canvas Frame -->
  <rect x="20" y="20" width="1610" height="1235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Architectural Title Block Header -->
  <rect x="20" y="20" width="1610" height="85" rx="12" fill="#0f172a"/>
  <rect x="20" y="85" width="1610" height="20" fill="#0f172a"/>

  <text x="50" y="60" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="0.5">BAMBU STAND: 3D PRINTER WORKBENCH BLUEPRINTS</text>
  <text x="50" y="85" font-size="14" fill="#94a3b8">Solid Walnut Top (24"x48"x1") • L-Shaped 2x4 SPF Legs • 3-Tier Spool Drawers • CR-6 SE Bay • Anti-Racking Shear Wall</text>

  <!-- Title Block Right Info -->
  <rect x="1230" y="32" width="375" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1250" y="55" font-size="13" font-weight="bold" fill="#38bdf8">SHEET 3 OF 4:</text>
  <text x="1350" y="55" font-size="13" font-weight="bold" fill="#ffffff">PLYWOOD PANELS &amp; THICKNESS GUIDE</text>
  <text x="1250" y="76" font-size="11" fill="#94a3b8">SCALE: NTS (DIMENSIONED) • UNITS: INCHES (")</text>

  <!-- Sheet Subtitle Banner -->
  <rect x="20" y="105" width="1610" height="36" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="129" font-size="14" font-weight="bold" fill="#0f172a">» Plywood Panels &amp; Thickness Guide: <tspan font-weight="normal" fill="#475569">Dimensioned cutting layouts, exact thickness specifications, and Home Depot Canada SKUs</tspan></text>


  <!-- ========================================================================= -->
  <!-- THICKNESS LEGEND BANNER (TOP) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="1550" height="100" rx="10" fill="#0f172a" filter="url(#shadow)"/>
    <text x="30" y="35" font-size="16" font-weight="bold" fill="#38bdf8">PLYWOOD THICKNESS SPECIFICATION LEGEND (COLUMBIA FOREST PRODUCTS PUREBOND):</text>
    
    <g transform="translate(30, 52)">
      <!-- 3/4" Birch -->
      <rect x="0" y="0" width="340" height="34" rx="4" fill="#1e293b" stroke="#ca8a04" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="8" fill="#ca8a04"/>
      <text x="38" y="22" font-size="12" font-weight="bold" fill="#fde047">3/4" (0.75") BIRCH PLYWOOD</text>
      <text x="220" y="22" font-size="11" fill="#cbd5e1">SKU 1001513690 ($41)</text>

      <!-- 1/2" Birch -->
      <rect x="360" y="0" width="340" height="34" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
      <circle cx="380" cy="17" r="8" fill="#eab308"/>
      <text x="398" y="22" font-size="12" font-weight="bold" fill="#fef08a">1/2" (0.50") BIRCH PLYWOOD</text>
      <text x="580" y="22" font-size="11" fill="#cbd5e1">SKU 1001513691 ($36)</text>

      <!-- 3/4" Walnut -->
      <rect x="720" y="0" width="340" height="34" rx="4" fill="#1e293b" stroke="#8a5a36" stroke-width="1.5"/>
      <circle cx="740" cy="17" r="8" fill="#8a5a36"/>
      <text x="758" y="22" font-size="12" font-weight="bold" fill="#fed7aa">3/4" (0.75") WALNUT PLYWOOD</text>
      <text x="955" y="22" font-size="11" fill="#cbd5e1">Walnut 2x4' ($54)</text>

      <!-- 1/4" Birch -->
      <rect x="1080" y="0" width="340" height="34" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="1100" cy="17" r="8" fill="#94a3b8"/>
      <text x="1118" y="22" font-size="12" font-weight="bold" fill="#ffffff">1/4" (0.25") BIRCH PLYWOOD</text>
      <text x="1310" y="22" font-size="11" fill="#cbd5e1">SKU 1001513692 ($28)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: 3/4" BIRCH CARCASS PANELS -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="760" height="420" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="760" height="38" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="26" width="760" height="12" fill="#e2e8f0"/>
    <text x="20" y="24" font-size="14" font-weight="bold" fill="#0f172a">1. 3/4" (0.75") BIRCH PLYWOOD PANELS (SKU 1001513690 - 1 Panel 2'x4')</text>

    <g transform="translate(40, 60)">
      <!-- Center Divider Gable -->
      <rect x="20" y="20" width="270" height="300" rx="3" fill="url(#birchGrad)" stroke="#ca8a04" stroke-width="2.5"/>
      <text x="155" y="140" font-size="15" font-weight="bold" fill="#713f12" text-anchor="middle">Center_Divider_Gable</text>
      <text x="155" y="165" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">THICKNESS: 3/4" (0.75")</text>
      <text x="155" y="185" font-size="12" fill="#854d0e" text-anchor="middle">18.00" Wide x 22.00" High</text>
      <text x="155" y="210" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">QTY: 1x</text>

      <!-- Dimensions -->
      <line x1="20" y1="335" x2="290" y2="335" stroke="#0f172a" stroke-width="1.5"/>
      <text x="155" y="352" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">18.00" (Depth)</text>

      <line x1="5" y1="20" x2="5" y2="320" stroke="#0f172a" stroke-width="1.5"/>
      <text x="0" y="170" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-90 0 170)">22.00" (Height)</text>

      <!-- CR-6 Tech Shelf -->
      <rect x="360" y="45" width="290" height="250" rx="3" fill="url(#birchGrad)" stroke="#ca8a04" stroke-width="2.5"/>
      <text x="505" y="140" font-size="15" font-weight="bold" fill="#713f12" text-anchor="middle">CR6_Tech_Shelf</text>
      <text x="505" y="165" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">THICKNESS: 3/4" (0.75")</text>
      <text x="505" y="185" font-size="12" fill="#854d0e" text-anchor="middle">18.625" Wide x 18.00" Deep</text>
      <text x="505" y="210" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">QTY: 1x</text>

      <!-- Dimensions -->
      <line x1="360" y1="310" x2="650" y2="310" stroke="#0f172a" stroke-width="1.5"/>
      <text x="505" y="327" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">18.625" (Width)</text>

      <line x1="665" y1="45" x2="665" y2="295" stroke="#0f172a" stroke-width="1.5"/>
      <text x="680" y="170" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(90 680 170)">18.00" (Depth)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: 3/4" WALNUT DRAWER FRONTS -->
  <!-- ========================================================================= -->
  <g transform="translate(840, 280)">
    <rect x="0" y="0" width="760" height="420" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
