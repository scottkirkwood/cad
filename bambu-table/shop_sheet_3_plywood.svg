    <g transform="translate(40, 60)">
      <!-- Spool Drawer Faces (Repeat 2x) -->
      <rect x="20" y="20" width="310" height="145" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2.5"/>
      <text x="175" y="65" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_02_Middle_Spools_Face</text>
      <text x="175" y="85" font-size="12" font-weight="bold" fill="#fed7aa" text-anchor="middle">THICKNESS: 3/4" (0.75")</text>
      <text x="175" y="105" font-size="12" fill="#ffedd5" text-anchor="middle">18.375" W x 8.50" H</text>
      <text x="175" y="130" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">QTY: 1x (Spool Drawer)</text>

      <rect x="360" y="20" width="310" height="145" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2.5"/>
      <text x="515" y="65" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_03_Bottom_Spools_Face</text>
      <text x="515" y="85" font-size="12" font-weight="bold" fill="#fed7aa" text-anchor="middle">THICKNESS: 3/4" (0.75")</text>
      <text x="515" y="105" font-size="12" fill="#ffedd5" text-anchor="middle">18.375" W x 8.50" H</text>
      <text x="515" y="130" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">QTY: 1x (Spool Drawer)</text>

      <text x="345" y="195" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">◄── REPEAT 2x: Two Identical 8.5" x 18.375" Spool Drawer Faces ──►</text>

      <!-- Tool Drawer Face (1x) -->
      <rect x="190" y="220" width="310" height="85" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2.5"/>
      <text x="345" y="250" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_01_Top_Tools_Face</text>
      <text x="345" y="268" font-size="12" font-weight="bold" fill="#fed7aa" text-anchor="middle">THICKNESS: 3/4" (0.75") • QTY: 1x</text>
      <text x="345" y="286" font-size="11" fill="#ffedd5" text-anchor="middle">18.375" Wide x 4.50" High</text>

      <!-- Dimensions -->
      <line x1="190" y1="320" x2="500" y2="320" stroke="#0f172a" stroke-width="1.5"/>
      <text x="345" y="337" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">18.375" (Width for all 3 drawer faces)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: 1/2" BIRCH SHEAR WALL & DRAWER BOX PANELS (BOTTOM) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="1550" height="505" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1550" height="38" rx="10" fill="#0f172a"/>
    <rect x="0" y="26" width="1550" height="12" fill="#0f172a"/>
    <text x="20" y="24" font-size="14" font-weight="bold" fill="#ffffff">3. 1/2" (0.50") BIRCH PLYWOOD (SKU 1001513691 - 3 Panels 2'x4') &amp; 1/4" BOTTOMS</text>

    <g transform="translate(30, 55)">
      <!-- Rear Shear Wall Panel (Large) -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="460" height="295" rx="4" fill="url(#birchGrad)" stroke="#ca8a04" stroke-width="2.5"/>
        <text x="230" y="110" font-size="16" font-weight="bold" fill="#713f12" text-anchor="middle">Rear_Shear_Wall_Panel</text>
        <text x="230" y="135" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">THICKNESS: 1/2" (0.50")</text>
        <text x="230" y="155" font-size="13" fill="#854d0e" text-anchor="middle">45.00" Wide x 29.00" High</text>
        <text x="230" y="180" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">QTY: 1x</text>
        <text x="230" y="210" font-size="11" fill="#475569" text-anchor="middle">Screwed across full rear frame (aprons &amp; legs)</text>
        <text x="230" y="225" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">VIBRATION DEFENSE: STOPS RACKING 100%</text>

        <!-- Dimensions -->
        <line x1="0" y1="315" x2="460" y2="315" stroke="#0f172a" stroke-width="1.5"/>
        <text x="230" y="332" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">45.00" (Width)</text>
        <line x1="475" y1="0" x2="475" y2="295" stroke="#0f172a" stroke-width="1.5"/>
        <text x="490" y="150" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(90 490 150)">29.00" (Height)</text>
      </g>

      <!-- Drawer Box Panels Schedule (Right Side) -->
      <g transform="translate(540, 10)">
        <text x="0" y="20" font-size="14" font-weight="bold" fill="#0f172a">DRAWER BOX CUT LIST (1/2" BIRCH WALLS + 1/4" BIRCH BOTTOMS):</text>
        
        <!-- Table -->
        <g transform="translate(0, 35)" font-size="12">
          <rect x="0" y="0" width="940" height="340" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          
          <text x="20" y="25" font-weight="bold" fill="#475569">DRAWER BOX COMPONENT</text>
          <text x="260" y="25" font-weight="bold" fill="#475569">QTY</text>
          <text x="320" y="25" font-weight="bold" fill="#475569">THICKNESS</text>
          <text x="440" y="25" font-weight="bold" fill="#475569">CUT SIZE (W x H)</text>
          <text x="620" y="25" font-weight="bold" fill="#475569">DRAWER ASSIGNMENT &amp; NOTES</text>
          <line x1="20" y1="35" x2="920" y2="35" stroke="#cbd5e1" stroke-width="1"/>

          <text x="20" y="65" font-weight="bold" fill="#0f172a">Spool_Box_Sides</text>
          <text x="260" y="65" font-weight="bold" fill="#dc2626">4x</text>
          <text x="320" y="65" font-weight="bold" fill="#b45309">1/2" (0.50")</text>
          <text x="440" y="65" font-weight="bold" fill="#0f172a">18.00" x 7.75"</text>
          <text x="620" y="65" fill="#334155"><tspan font-weight="bold">REPEAT 4x:</tspan> Left/Right sides for Drawers 2 &amp; 3</text>

          <text x="20" y="100" font-weight="bold" fill="#0f172a">Spool_Box_Front_Back</text>
          <text x="260" y="100" font-weight="bold" fill="#dc2626">4x</text>
          <text x="320" y="100" font-weight="bold" fill="#b45309">1/2" (0.50")</text>
          <text x="440" y="100" font-weight="bold" fill="#0f172a">17.375" x 7.75"</text>
          <text x="620" y="100" fill="#334155"><tspan font-weight="bold">REPEAT 4x:</tspan> Front/Back sub-panels for Drawers 2 &amp; 3</text>

          <text x="20" y="135" font-weight="bold" fill="#0f172a">Tool_Box_Sides</text>
          <text x="260" y="135" font-weight="bold" fill="#dc2626">2x</text>
          <text x="320" y="135" font-weight="bold" fill="#b45309">1/2" (0.50")</text>
          <text x="440" y="135" font-weight="bold" fill="#0f172a">18.00" x 3.50"</text>
          <text x="620" y="135" fill="#334155"><tspan font-weight="bold">REPEAT 2x:</tspan> Left/Right sides for Top Tool Drawer</text>

          <text x="20" y="170" font-weight="bold" fill="#0f172a">Tool_Box_Front_Back</text>
          <text x="260" y="170" font-weight="bold" fill="#dc2626">2x</text>
          <text x="320" y="170" font-weight="bold" fill="#b45309">1/2" (0.50")</text>
          <text x="440" y="170" font-weight="bold" fill="#0f172a">17.375" x 3.50"</text>
          <text x="620" y="170" fill="#334155"><tspan font-weight="bold">REPEAT 2x:</tspan> Front/Back sub-panels for Top Tool Drawer</text>

          <text x="20" y="205" font-weight="bold" fill="#0284c7">Drawer_Bottom_Panels</text>
          <text x="260" y="205" font-weight="bold" fill="#dc2626">3x</text>
          <text x="320" y="205" font-weight="bold" fill="#0284c7">1/4" (0.25")</text>
          <text x="440" y="205" font-weight="bold" fill="#0f172a">17.375" x 17.50"</text>
          <text x="620" y="205" fill="#334155"><tspan font-weight="bold">REPEAT 3x:</tspan> 1/4" Birch bottoms for all 3 drawer boxes</text>

          <line x1="20" y1="225" x2="920" y2="225" stroke="#cbd5e1" stroke-width="1"/>
          
          <text x="20" y="255" font-size="12" font-weight="bold" fill="#0f172a">JOINERY METHOD FOR 1/2" BIRCH DRAWER BOXES:</text>
          <text x="20" y="275" font-size="11" fill="#475569">• Set Kreg Jig to <tspan font-weight="bold">1/2" material thickness</tspan>. Drill pocket holes on outside of front and back sub-panels.</text>
          <text x="20" y="292" font-size="11" fill="#475569">• Fasten using <tspan font-weight="bold">1" pan-head pocket screws</tspan> + Titebond II wood glue. (Completely hidden once walnut face is mounted!).</text>
          <text x="20" y="310" font-size="11" fill="#475569">• Slide rails mount to sides with 1/4" standoff block; 3/4" Walnut faces screw from inside box with 1" screws.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
