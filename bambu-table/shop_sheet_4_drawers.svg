<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1275" width="1650" height="1275" style="background:#ffffff; font-family:'Liberation Sans', Arial, sans-serif;">
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5a36"/>
      <stop offset="50%" stop-color="#6e4324"/>
      <stop offset="100%" stop-color="#543217"/>
    </linearGradient>
    <linearGradient id="spfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="birchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  
  <!-- Background Canvas Frame -->
  <rect x="20" y="20" width="1610" height="1235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Architectural Title Block Header -->
  <rect x="20" y="20" width="1610" height="85" rx="12" fill="#0f172a"/>
  <rect x="20" y="85" width="1610" height="20" fill="#0f172a"/>

  <text x="50" y="60" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="0.5">BAMBU STAND: 3D PRINTER WORKBENCH BLUEPRINTS</text>
  <text x="50" y="85" font-size="14" fill="#94a3b8">Solid Walnut Top (24"x48"x1") • L-Shaped 2x4 SPF Legs • 3-Tier Spool Drawers • CR-6 SE Bay • Anti-Racking Shear Wall</text>

  <!-- Title Block Right Info -->
  <rect x="1230" y="32" width="375" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1250" y="55" font-size="13" font-weight="bold" fill="#38bdf8">SHEET 4 OF 4:</text>
  <text x="1350" y="55" font-size="13" font-weight="bold" fill="#ffffff">3-TIER DRAWER BANK &amp; SLIDE ELEVATIONS</text>
  <text x="1250" y="76" font-size="11" fill="#94a3b8">SCALE: NTS (DIMENSIONED) • UNITS: INCHES (")</text>

  <!-- Sheet Subtitle Banner -->
  <rect x="20" y="105" width="1610" height="36" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="129" font-size="14" font-weight="bold" fill="#0f172a">» 3-Tier Drawer Bank &amp; Slide Elevations: <tspan font-weight="normal" fill="#475569">Slide mounting heights, 8-5/8 inch story stick spacing, 1/8 inch reveals, and 12-spool capacity</tspan></text>


  <!-- ========================================================================= -->
  <!-- LEFT BAY ELEVATION & SLIDE STACK (LEFT) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="760" height="1065" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="760" height="40" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="28" width="760" height="12" fill="#e2e8f0"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">1. DRAWER STACK ELEVATION &amp; SLIDE TRACK ELEVATIONS</text>

    <!-- Detailed Elevation Graphic -->
    <g transform="translate(60, 60)">
      <!-- Bay frame boundary: Width 18.625" = 465px, Height 22.0" = 550px -->
      <!-- Left leg & center divider walls -->
      <rect x="30" y="30" width="45" height="740" fill="url(#spfGrad)" stroke="#b45309" stroke-width="2"/>
      <text x="52" y="400" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle" transform="rotate(-90 52 400)">Left_Leg (2x4 SPF)</text>

      <rect x="520" y="30" width="18" height="740" fill="url(#birchGrad)" stroke="#ca8a04" stroke-width="2"/>
      <text x="532" y="400" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle" transform="rotate(-90 532 400)">Center_Divider (3/4" Birch)</text>

      <!-- Upper Apron (Top) -->
      <rect x="75" y="30" width="445" height="50" fill="url(#spfGrad)" stroke="#b45309" stroke-width="1.5"/>
      <text x="295" y="60" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Upper_Front_Apron (2x4, 3.5" Deep)</text>

      <!-- Lower Stretcher (Bottom) -->
      <rect x="75" y="720" width="445" height="50" fill="url(#spfGrad)" stroke="#b45309" stroke-width="1.5"/>
      <text x="295" y="750" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Lower_Front_Stretcher (Z = 1.5" to 5.0")</text>

      <!-- 1/8" Reveal gap line at top -->
      <line x1="75" y1="83" x2="520" y2="83" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="470" y="95" font-size="10" font-weight="bold" fill="#dc2626">1/8" Reveal</text>

      <!-- DRAWER 1: TOP TOOL TRAY (Face: 4.5" H = 112px) -->
      <!-- Y: 83 to 195 -->
      <rect x="78" y="86" width="439" height="110" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2"/>
      <rect x="278" y="135" width="40" height="8" rx="2" fill="#0f172a"/>
      <text x="298" y="120" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_01_Top_Tools_Face</text>
      <text x="298" y="165" font-size="11" fill="#fed7aa" text-anchor="middle">3/4" Walnut: 4.50" H x 18.375" W</text>
      
      <!-- Slide Track 1 -->
      <line x1="60" y1="160" x2="100" y2="160" stroke="#0284c7" stroke-width="4"/>
      <circle cx="100" cy="160" r="4" fill="#0284c7"/>
      <text x="110" y="164" font-size="11" font-weight="bold" fill="#0284c7">Slide #1 (Top)</text>

      <!-- 1/8" Reveal gap line -->
      <line x1="75" y1="198" x2="520" y2="198" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="470" y="210" font-size="10" font-weight="bold" fill="#dc2626">1/8" Reveal</text>

      <!-- DRAWER 2: MIDDLE SPOOL DRAWER (Face: 8.5" H = 212px) -->
      <!-- Y: 201 to 413 -->
      <rect x="78" y="201" width="439" height="210" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2"/>
      <rect x="278" y="295" width="40" height="8" rx="2" fill="#0f172a"/>
      <text x="298" y="245" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_02_Middle_Spools_Face</text>
      <text x="298" y="268" font-size="12" fill="#fed7aa" text-anchor="middle">3/4" Walnut: 8.50" H x 18.375" W</text>
      <text x="298" y="340" font-size="11" font-weight="bold" fill="#ffedd5" text-anchor="middle">12 Upright 1kg Spools (2 Rows of 6)</text>

      <!-- Slide Track 2 -->
      <line x1="60" y1="375" x2="100" y2="375" stroke="#0284c7" stroke-width="4"/>
      <circle cx="100" cy="375" r="4" fill="#0284c7"/>
      <text x="110" y="379" font-size="11" font-weight="bold" fill="#0284c7">Slide #2 (Middle)</text>

      <!-- 1/8" Reveal gap line -->
      <line x1="75" y1="413" x2="520" y2="413" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="470" y="425" font-size="10" font-weight="bold" fill="#dc2626">1/8" Reveal</text>

      <!-- DRAWER 3: BOTTOM SPOOL DRAWER (Face: 8.5" H = 212px) -->
      <!-- Y: 416 to 628 -->
      <rect x="78" y="416" width="439" height="210" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2"/>
      <rect x="278" y="510" width="40" height="8" rx="2" fill="#0f172a"/>
      <text x="298" y="460" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Drawer_03_Bottom_Spools_Face</text>
      <text x="298" y="483" font-size="12" fill="#fed7aa" text-anchor="middle">3/4" Walnut: 8.50" H x 18.375" W</text>
      <text x="298" y="555" font-size="11" font-weight="bold" fill="#ffedd5" text-anchor="middle">12 Upright 1kg Spools (2 Rows of 6)</text>

      <!-- Slide Track 3 -->
      <line x1="60" y1="590" x2="100" y2="590" stroke="#0284c7" stroke-width="4"/>
      <circle cx="100" cy="590" r="4" fill="#0284c7"/>
      <text x="110" y="594" font-size="11" font-weight="bold" fill="#0284c7">Slide #3 (Bottom)</text>

      <!-- STORY STICK SPACING DIMENSIONS (EXACT 8-5/8" / 219mm REPEAT) -->
      <!-- Between Slide 3 and Slide 2 -->
      <line x1="15" y1="590" x2="15" y2="375" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="8" y1="590" x2="22" y2="590" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="8" y1="375" x2="22" y2="375" stroke="#dc2626" stroke-width="2.5"/>
      <text x="8" y="485" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle" transform="rotate(-90 8 485)">8-5/8" (219.1mm) STORY STICK</text>

      <!-- Between Slide 2 and Slide 1 -->
      <line x1="15" y1="375" x2="15" y2="160" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="8" y1="375" x2="22" y2="375" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="8" y1="160" x2="22" y2="160" stroke="#dc2626" stroke-width="2.5"/>
      <text x="8" y="270" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle" transform="rotate(-90 8 270)">8-5/8" (219.1mm) STORY STICK</text>

      <!-- Slide 3 height from bottom stretcher -->
      <line x1="560" y1="720" x2="560" y2="590" stroke="#0284c7" stroke-width="2"/>
      <line x1="555" y1="720" x2="565" y2="720" stroke="#0284c7" stroke-width="2"/>
      <line x1="555" y1="590" x2="565" y2="590" stroke="#0284c7" stroke-width="2"/>
      <text x="575" y="660" font-size="11" font-weight="bold" fill="#0284c7">1.625" (1-5/8")</text>
      <text x="575" y="675" font-size="10" fill="#64748b">Slide 3 CL to rail</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: 12-SPOOL TRAY LAYOUT & DRAWER BOX BLUEPRINTS -->
  <!-- ========================================================================= -->
  <g transform="translate(840, 160)">
    <!-- Spool Drawer Plan (Top) -->
    <rect x="0" y="0" width="760" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="760" height="40" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="28" width="760" height="12" fill="#e2e8f0"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">2. SPOOL DRAWER BOX INTERIOR (12 SPOOLS STANDING UPRIGHT)</text>

    <!-- Top-Down Spool Layout Graphic -->
    <g transform="translate(45, 60)">
      <!-- Drawer Box Boundary: 17.375" W x 18.0" D -> Scale: 30px per inch -> 521px x 400px -->
      <rect x="20" y="10" width="521" height="380" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <text x="280" y="30" font-size="12" font-weight="bold" fill="#713f12" text-anchor="middle">DRAWER BOX INTERIOR (16.375" Clear Width x 17.0" Clear Depth)</text>

      <!-- 12 Spool Circles (2 Rows of 6) -->
      <!-- Spool diameter ~ 7.87" = 80px scale, width ~ 2.56" -->
      <!-- Row 1 (Rear) -->
      <g transform="translate(30, 50)">
        <ellipse cx="40" cy="80" rx="35" ry="70" fill="#38bdf8" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
        <ellipse cx="40" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
        <ellipse cx="120" cy="80" rx="35" ry="70" fill="#f43f5e" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
        <ellipse cx="120" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
        <ellipse cx="200" cy="80" rx="35" ry="70" fill="#10b981" stroke="#059669" stroke-width="2" opacity="0.85"/>
        <ellipse cx="200" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
        <ellipse cx="280" cy="80" rx="35" ry="70" fill="#f59e0b" stroke="#d97706" stroke-width="2" opacity="0.85"/>
        <ellipse cx="280" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
        <ellipse cx="360" cy="80" rx="35" ry="70" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" opacity="0.85"/>
        <ellipse cx="360" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <ellipse cx="440" cy="80" rx="35" ry="70" fill="#06b6d4" stroke="#0891b2" stroke-width="2" opacity="0.85"/>
        <ellipse cx="440" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
        <text x="240" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">ROW 1: 6x 1kg SPOOLS (STANDING UPRIGHT)</text>
      </g>

      <!-- Row 2 (Front) -->
      <g transform="translate(30, 215)">
        <ellipse cx="40" cy="80" rx="35" ry="70" fill="#ec4899" stroke="#db2777" stroke-width="2" opacity="0.85"/>
        <ellipse cx="40" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
        <ellipse cx="120" cy="80" rx="35" ry="70" fill="#3b82f6" stroke="#2563eb" stroke-width="2" opacity="0.85"/>
        <ellipse cx="120" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
        <ellipse cx="200" cy="80" rx="35" ry="70" fill="#eab308" stroke="#ca8a04" stroke-width="2" opacity="0.85"/>
        <ellipse cx="200" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
        <ellipse cx="280" cy="80" rx="35" ry="70" fill="#14b8a6" stroke="#0d9488" stroke-width="2" opacity="0.85"/>
        <ellipse cx="280" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
        <ellipse cx="360" cy="80" rx="35" ry="70" fill="#6366f1" stroke="#4f46e5" stroke-width="2" opacity="0.85"/>
        <ellipse cx="360" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
        <ellipse cx="440" cy="80" rx="35" ry="70" fill="#f97316" stroke="#ea580c" stroke-width="2" opacity="0.85"/>
        <ellipse cx="440" cy="80" rx="10" ry="20" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
        <text x="240" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">ROW 2: 6x 1kg SPOOLS (STANDING UPRIGHT)</text>
      </g>

      <!-- Walnut Drawer Face Mounted on Front -->
      <rect x="10" y="390" width="541" height="20" rx="3" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2"/>
      <text x="280" y="405" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3/4" Walnut Drawer Face (Flush Mounted to Box Front)</text>
    </g>

    <!-- Capacity Banner -->
    <rect x="20" y="475" width="720" height="32" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="380" y="496" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">TOTAL SPOOL STORAGE: 2 DRAWERS x 12 SPOOLS = 24 FULL 1KG FILAMENT SPOOLS!</text>
  </g>

  <!-- Bottom Details Box (Right Bottom) -->
  <g transform="translate(840, 700)">
    <rect x="0" y="0" width="760" height="525" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="760" height="38" rx="10" fill="#0f172a"/>
    <rect x="0" y="26" width="760" height="12" fill="#0f172a"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#ffffff">3. JIG REFERENCE &amp; HARDWARE MOUNTING SUMMARY</text>

    <g transform="translate(30, 55)" font-size="12">
      <text x="0" y="20" font-size="13" font-weight="bold" fill="#0f172a">HOW THE 3D PRINTABLE JIGS ACCELERATE THIS DRAWER BUILD:</text>
      
      <!-- Jig 1 -->
      <rect x="0" y="35" width="700" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="18" y="58" font-size="13" font-weight="bold" fill="#1e40af">JIG 1: Setback Cradle (drawer_installation_jigs.stl)</text>
      <text x="18" y="78" font-size="11.5" fill="#1e3a8a">• Hooks over the front 2x4 leg/post to automatically set the <tspan font-weight="bold">2.5mm (3/32") slide setback</tspan>.</text>
      <text x="18" y="96" font-size="11.5" fill="#1e3a8a">• Shelf supports the 18" metal slide hands-free; drive screw through the <tspan font-weight="bold">center access window</tspan>.</text>

      <!-- Jig 2 -->
      <rect x="0" y="130" width="700" height="85" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
      <text x="18" y="153" font-size="13" font-weight="bold" fill="#854d0e">JIG 2: Mounting Blocks (Pair under drawer box)</text>
      <text x="18" y="173" font-size="11.5" fill="#713f12">• Sits flat on bench under drawer box; supports slide on the <tspan font-weight="bold">1/4" (6.35mm) standoff step</tspan>.</text>
      <text x="18" y="191" font-size="11.5" fill="#713f12">• Lifts slide so bottom screws never scrape, then pinch the <tspan font-weight="bold">top diamond notch</tspan> to pull blocks out.</text>

      <!-- Jig 3 -->
      <rect x="0" y="225" width="700" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="18" y="248" font-size="13" font-weight="bold" fill="#166534">JIG 3: 1/8" Reveal Shims (Set of 4 around drawer face)</text>
      <text x="18" y="268" font-size="11.5" fill="#14532d">• Slipped into the perimeter gaps around the 3/4" Walnut drawer faces while clamping from inside.</text>
      <text x="18" y="286" font-size="11.5" fill="#14532d">• Guarantees a perfectly uniform <tspan font-weight="bold">1/8" reveal margin</tspan> around all drawers.</text>

      <!-- Story Stick -->
      <rect x="0" y="320" width="700" height="85" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
      <text x="18" y="343" font-size="13" font-weight="bold" fill="#9d174d">SLIDE TIER STORY STICK: 8-5/8" (219mm) Carcass Spacing (slide_tier_story_stick.stl)</text>
      <text x="18" y="363" font-size="11.5" fill="#831843">• Hooks under lower slide track and holds upper slide track at exact <tspan font-weight="bold">8-5/8" (219.1mm) elevation</tspan>.</text>
      <text x="18" y="381" font-size="11.5" fill="#831843">• Guarantees Slide 2 and Slide 1 are dead level and identical on both sides of the cabinet.</text>

      <!-- Drawer Pull Jig -->
      <rect x="0" y="415" width="700" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="18" y="438" font-size="13" font-weight="bold" fill="#0f172a">DRAWER PULL TEMPLATE: 5" (128mm) Bar Pulls (drawer_pull_jig.stl)</text>
      <text x="18" y="458" font-size="11.5" fill="#334155">• Center notch lines up with 9-3/16" pencil mark; guides 3/16" holes at 128mm spacing.</text>
    </g>
  </g>
</svg>
