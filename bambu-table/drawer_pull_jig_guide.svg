<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050" style="background:#ffffff; font-family:'Liberation Sans', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#475569"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5a36"/>
      <stop offset="50%" stop-color="#6e4324"/>
      <stop offset="100%" stop-color="#543217"/>
    </linearGradient>
    <linearGradient id="walnutSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543217"/>
      <stop offset="100%" stop-color="#3d220e"/>
    </linearGradient>
    <linearGradient id="jigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jigDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas & Grid Frame -->
  <rect x="20" y="20" width="1560" height="1010" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="1560" height="90" rx="16" fill="#0f172a"/>
  <rect x="20" y="94" width="1560" height="16" fill="#0f172a"/>
  
  <text x="60" y="65" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="0.5">HOW TO USE THE 3D PRINTED DRAWER PULL DRILLING JIG</text>
  <text x="60" y="92" font-size="15" fill="#94a3b8">Bambu Stand 3D Printer Storage Workbench • 5" (128mm) Center-to-Center Bar Pulls • 3/4" Walnut Drawer Faces</text>
  <rect x="1350" y="42" width="190" height="36" rx="6" fill="#0284c7"/>
  <text x="1445" y="66" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">100% SUPPORT-FREE</text>

  <!-- ========================================================================= -->
  <!-- PANEL 1: SIDE CROSS-SECTION ELEVATION (LEFT) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 140)">
    <!-- Box container -->
    <rect x="0" y="0" width="680" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="680" height="46" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="34" width="680" height="12" fill="#f1f5f9"/>
    <text x="24" y="30" font-size="16" font-weight="bold" fill="#1e293b">1. SIDE CROSS-SECTION (HOW JIG HOOKS OVER WOOD)</text>

    <!-- Side View Schematic Group -->
    <g transform="translate(60, 70)">
      <!-- Reference Center Grid Line -->
      <line x1="280" y1="40" x2="280" y2="340" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5"/>

      <!-- WALNUT DRAWER FRONT CUTAWAY -->
      <!-- Drawer wood section (3/4" = 19mm thick, height ~ 220mm) -->
      <rect x="200" y="70" width="120" height="260" rx="2" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2.5"/>
      <!-- Wood grain lines -->
      <path d="M 230 70 Q 235 150 230 330 M 270 70 Q 260 170 270 330 M 295 70 Q 305 180 295 330" stroke="#45260e" stroke-width="1.2" opacity="0.4" fill="none"/>
      
      <!-- Drawer Front Label -->
      <text x="260" y="220" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">WALNUT</text>
      <text x="260" y="240" font-size="13" font-weight="bold" fill="#fed7aa" text-anchor="middle">DRAWER FRONT</text>
      <text x="260" y="260" font-size="11" fill="#ffedd5" text-anchor="middle">3/4" Thick (19mm)</text>

      <!-- PRINTED JIG (CROSS-SECTION IN BLUE) -->
      <!-- Jig L-Profile:
           - Top spine: X: 145 to 200 (55mm), Y: 40 to 70 (30mm)
           - Drop Lip (catches back): X: 145 to 200, Y: 40 to 70...
           Wait, let's draw exactly the printed L-cross-section:
           Outer flat back: X = 130
           Plate thickness: 35px (~6mm scale) -> X from 130 to 165
           Plate height: Y from 70 to 300 (230px)
           Top hook: Y from 40 to 70 (30px), hooks over top edge of wood (X: 165 to 240)
      -->
      <!-- Main Face Plate (6mm thick, hangs down front face of wood) -->
      <path d="M 155,40 L 220,40 L 220,70 L 195,70 L 195,290 L 155,290 Z" 
            fill="url(#jigGrad)" stroke="#0369a1" stroke-width="2.5"/>

      <!-- 90° Inside Step Corner Highlight -->
      <rect x="195" y="65" width="25" height="10" fill="#facc15" opacity="0.4"/>
      <circle cx="195" cy="70" r="4" fill="#dc2626"/>

      <!-- Raised AMS Text on the inside step (facing the wood) -->
      <rect x="195" y="105" width="5" height="35" fill="#0f172a"/>
      <line x1="200" y1="122" x2="235" y2="122" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <text x="242" y="126" font-size="11" font-weight="bold" fill="#dc2626">Raised AMS Text (Faces wood)</text>

      <!-- Drill Bushing Hole (through plate at 22mm down) -->
      <rect x="155" y="180" width="40" height="24" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="120" y1="192" x2="230" y2="192" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>

      <!-- Drill Bit entering from flat outer side -->
      <path d="M 60,186 L 125,186 L 145,192 L 125,198 L 60,198 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="1.5"/>
      <line x1="60" y1="186" x2="125" y2="198" stroke="#475569" stroke-width="1.2"/>
      <line x1="75" y1="186" x2="135" y2="196" stroke="#475569" stroke-width="1.2"/>
      <text x="50" y="196" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">DRILL BIT (3/16") ──►</text>

      <!-- Annotations & Dimensions -->
      <!-- Dimension: 22mm / 7/8" from Top Edge to Hole Center -->
      <line x1="140" y1="70" x2="140" y2="192" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="135" y1="70" x2="145" y2="70" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="135" y1="192" x2="145" y2="192" stroke="#0284c7" stroke-width="1.5"/>
      <text x="130" y="136" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">22 mm (7/8")</text>
      <text x="130" y="152" font-size="10" fill="#64748b" text-anchor="end">Offset from top</text>

      <!-- Callout: Top Hook Step -->
      <path d="M 220,55 L 340,30" stroke="#0284c7" stroke-width="1.5" marker-start="url(#arrow)"/>
      <text x="345" y="26" font-size="12" font-weight="bold" fill="#0284c7">22mm Inside Registration Step</text>
      <text x="345" y="42" font-size="11" fill="#475569">Hooks securely over the top edge of wood</text>

      <!-- Callout: Outer Drill Entry Face -->
      <path d="M 155,250 L 80,270" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow-slate)"/>
      <text x="75" y="285" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="end">Flat Outer Drill Face</text>
      <text x="75" y="301" font-size="11" fill="#64748b" text-anchor="end">(Printed flat on build plate)</text>

      <!-- Clamp Symbol -->
      <rect x="130" y="235" width="20" height="30" rx="3" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
      <rect x="320" y="235" width="20" height="30" rx="3" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
      <line x1="150" y1="250" x2="320" y2="250" stroke="#ea580c" stroke-width="3" stroke-dasharray="3,3"/>
      <text x="235" y="315" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">QUICK-GRIP CLAMP</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: FRONT ELEVATION & CENTERING (RIGHT) -->
  <!-- ========================================================================= -->
  <g transform="translate(770, 140)">
    <!-- Box container -->
    <rect x="0" y="0" width="770" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="770" height="46" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="34" width="770" height="12" fill="#f1f5f9"/>
    <text x="24" y="30" font-size="16" font-weight="bold" fill="#1e293b">2. FRONT VIEW (PENCIL CENTERLINE &amp; HOLE SPACING)</text>

    <!-- Front View Schematic Group -->
    <g transform="translate(35, 70)">
      <!-- Walnut Drawer Face Background -->
      <rect x="0" y="30" width="700" height="280" rx="4" fill="url(#walnutGrad)" stroke="#3d220e" stroke-width="2"/>
      
      <!-- Pencil Centerline on Drawer Face -->
      <line x1="350" y1="15" x2="350" y2="330" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5,4"/>
      <circle cx="350" cy="30" r="4" fill="#facc15"/>
      <text x="350" y="12" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">PENCIL CENTERLINE (9-3/16" from either side)</text>

      <!-- PRINTED JIG (MOUNTED ON TOP CENTER) -->
      <!-- Jig is 168mm long in scale (~ 440px wide), height 50mm (~ 130px) -->
      <rect x="130" y="30" width="440" height="130" rx="4" fill="url(#jigGrad)" stroke="#0369a1" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- Top fence band (shows the hooked part on top) -->
      <rect x="130" y="18" width="440" height="14" rx="2" fill="url(#jigDarkGrad)" stroke="#0369a1" stroke-width="1.5"/>

      <!-- Center Alignment Notch (V-Notch / Slot in Jig) -->
      <path d="M 346,18 L 354,18 L 354,42 L 346,42 Z" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <polygon points="350,46 345,54 355,54" fill="#dc2626"/>
      <text x="350" y="68" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">ALIGN NOTCH TO PENCIL MARK</text>

      <!-- Two Drill Guide Holes (spaced 128mm / 5.04" apart -> scale ~ 335px) -->
      <!-- Left Hole: 350 - 167.5 = 182.5 -->
      <!-- Right Hole: 350 + 167.5 = 517.5 -->
      <circle cx="182" cy="100" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <circle cx="182" cy="100" r="6" fill="#0f172a"/>
      <line x1="162" y1="100" x2="202" y2="100" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="182" y1="80" x2="182" y2="120" stroke="#dc2626" stroke-width="1.5"/>
      <text x="182" y="132" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">HOLE 1</text>
      <text x="182" y="146" font-size="10" fill="#334155" text-anchor="middle">(3/16" / 4.8mm)</text>

      <circle cx="518" cy="100" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <circle cx="518" cy="100" r="6" fill="#0f172a"/>
      <line x1="498" y1="100" x2="538" y2="100" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="518" y1="80" x2="518" y2="120" stroke="#dc2626" stroke-width="1.5"/>
      <text x="518" y="132" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">HOLE 2</text>
      <text x="518" y="146" font-size="10" fill="#334155" text-anchor="middle">(3/16" / 4.8mm)</text>

      <!-- Dimension Line between Holes (128mm / 5.04") -->
      <line x1="182" y1="168" x2="518" y2="168" stroke="#0284c7" stroke-width="2"/>
      <line x1="182" y1="158" x2="182" y2="178" stroke="#0284c7" stroke-width="2"/>
      <line x1="518" y1="158" x2="518" y2="178" stroke="#0284c7" stroke-width="2"/>
      <rect x="300" y="157" width="100" height="22" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="350" y="173" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">128 mm (5.04")</text>

      <!-- Drawer Width Dimension -->
      <line x1="0" y1="325" x2="700" y2="325" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="315" x2="0" y2="335" stroke="#475569" stroke-width="1.5"/>
      <line x1="700" y1="315" x2="700" y2="335" stroke="#475569" stroke-width="1.5"/>
      <text x="350" y="345" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">TOTAL DRAWER FACE WIDTH: 18-3/8" (466.7 mm)</text>

      <!-- Vertical Offset Dimension from top edge -->
      <line x1="100" y1="30" x2="100" y2="100" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="95" y1="30" x2="105" y2="30" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="95" y1="100" x2="105" y2="100" stroke="#dc2626" stroke-width="1.5"/>
      <text x="90" y="70" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="end">22mm (7/8")</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: STEP-BY-STEP WORKFLOW CARDS (BOTTOM) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 650)">
    <!-- Container -->
    <rect x="0" y="0" width="1480" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1480" height="46" rx="12" fill="#0f172a"/>
    <rect x="0" y="34" width="1480" height="12" fill="#0f172a"/>
    <text x="24" y="30" font-size="16" font-weight="bold" fill="#ffffff">3. FOUR-STEP DRILLING INSTRUCTIONS &amp; WOODWORKING PRO TIPS</text>

    <!-- Step 1 Card -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="18" fill="#0284c7"/>
      <text x="36" y="42" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="68" y="42" font-size="16" font-weight="bold" fill="#0f172a">Mark Centerline</text>
      <text x="20" y="80" font-size="13" fill="#334155">
        <tspan x="20" dy="0">• Drawer width is <tspan font-weight="bold">18-3/8" (466.7mm)</tspan>.</tspan>
        <tspan x="20" dy="24">• Measure <tspan font-weight="bold">9-3/16" (233.4mm)</tspan> from</tspan>
        <tspan x="32" dy="20">either side edge.</tspan>
        <tspan x="20" dy="24">• Make a crisp, sharp pencil tick</tspan>
        <tspan x="32" dy="20">mark on the <tspan font-weight="bold">top edge</tspan> of the drawer.</tspan>
      </text>
    </g>

    <!-- Step 2 Card -->
    <g transform="translate(390, 70)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="18" fill="#0284c7"/>
      <text x="36" y="42" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="68" y="42" font-size="16" font-weight="bold" fill="#0f172a">Hook Over Top Edge</text>
      <text x="20" y="80" font-size="13" fill="#334155">
        <tspan x="20" dy="0">• Take the printed blue jig.</tspan>
        <tspan x="20" dy="24">• Place the <tspan font-weight="bold">22mm inside step</tspan> over</tspan>
        <tspan x="32" dy="20">the top edge of the walnut face.</tspan>
        <tspan x="20" dy="24">• The flat drilling plate hangs down</tspan>
        <tspan x="32" dy="20">the front face of the drawer.</tspan>
        <tspan x="20" dy="24">• <tspan fill="#dc2626" font-weight="bold">Note:</tspan> The black text faces the wood.</tspan>
      </text>
    </g>

    <!-- Step 3 Card -->
    <g transform="translate(750, 70)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="18" fill="#0284c7"/>
      <text x="36" y="42" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="68" y="42" font-size="16" font-weight="bold" fill="#0f172a">Align Center Notch</text>
      <text x="20" y="80" font-size="13" fill="#334155">
        <tspan x="20" dy="0">• Slide the jig left or right until the</tspan>
        <tspan x="32" dy="20"><tspan font-weight="bold">center alignment notch</tspan> splits your</tspan>
        <tspan x="32" dy="20">pencil mark dead-center.</tspan>
        <tspan x="20" dy="24">• Firmly secure the jig using a</tspan>
        <tspan x="32" dy="20"><tspan font-weight="bold">Quick-Grip clamp</tspan> so it cannot</tspan>
        <tspan x="32" dy="20">shift while drilling.</tspan>
      </text>
    </g>

    <!-- Step 4 Card -->
    <g transform="translate(1110, 70)">
      <rect x="0" y="0" width="340" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="18" fill="#16a34a"/>
      <text x="36" y="42" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="68" y="42" font-size="16" font-weight="bold" fill="#0f172a">Drill Guide Holes</text>
      <text x="20" y="80" font-size="13" fill="#334155">
        <tspan x="20" dy="0">• Chuck a <tspan font-weight="bold">3/16" (4.8mm)</tspan> wood drill bit.</tspan>
        <tspan x="20" dy="24">• Drill through both guide holes.</tspan>
        <tspan x="20" dy="24">• <tspan font-weight="bold">Anti-Blowout Tip:</tspan> Clamp a scrap</tspan>
        <tspan x="32" dy="20">wood block behind the drawer face</tspan>
        <tspan x="32" dy="20">to prevent veneer blowout on exit.</tspan>
        <tspan x="20" dy="24">• Fasten your 5" pulls with #8 screws.</tspan>
      </text>
    </g>
  </g>
</svg>
